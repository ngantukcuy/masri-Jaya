<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masri Jaya | POS</title>
    <meta name="description" content="Masri Jaya — sistem manajemen toko bahan bangunan: kasir (POS), stok, pembelian, pelanggan, keuangan, dan laporan dalam satu aplikasi." />

    <!-- PWA: makes the app installable (Add to Home Screen / Install app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Masri Jaya" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts actually used by the app (see src/index.css --font-sans/--font-mono).
         Loaded directly here (instead of via @import inside the CSS bundle)
         so the browser's preload scanner can fetch them in parallel with
         the stylesheet, rather than only discovering them after the CSS
         file has been downloaded and parsed. Space Grotesk only ships
         weights 300-700 (font-extrabold/font-black in the app already
         clamp to 700), and weight 300 isn't used anywhere, so only
         400-700 are requested here. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
