<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masri Jaya | POS</title>
    <meta name="description" content="Masri Jaya — sistem manajemen toko bahan bangunan: kasir (POS), stok, pembelian, pelanggan, keuangan, dan laporan dalam satu aplikasi." />

    <!-- PWA: makes the app installable (Add to Home Screen / Install app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Masri Jaya" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts actually used by the app (see src/index.css --font-sans/--font-mono).
         Loaded directly here (instead of via @import inside the CSS bundle)
         so the browser's preload scanner can fetch them in parallel with
         the stylesheet, rather than only discovering them after the CSS
         file has been downloaded and parsed. Space Grotesk only ships
         weights 300-700 (font-extrabold/font-black in the app already
         clamp to 700), and weight 300 isn't used anywhere, so only
         400-700 are requested here. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="root"></div>
    <noscript>Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</noscript>
    <!-- Jaring pengaman: kalau JS gagal dimuat/dijalankan SEBELUM React sempat
         tampil (browser HP terlalu lama, file gagal diunduh, error saat start),
         layar tidak dibiarkan putih — pesan errornya ditampilkan. Skrip biasa
         (bukan module) supaya tetap jalan walau bundle utama gagal. -->
    <script>
      (function () {
        var shown = false;
        function show(msg) {
          var root = document.getElementById('root');
          if (shown || !root || root.childNodes.length > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f8fafc;font-family:system-ui,sans-serif">' +
            '<div style="max-width:420px;width:100%;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)">' +
            '<h2 style="margin:0 0 8px;font-size:15px;color:#0f172a">Aplikasi gagal dimuat</h2>' +
            '<p style="margin:0 0 10px;font-size:12px;color:#475569">Coba muat ulang. Kalau tetap begini, kirim pesan di bawah ini ke pengembang.</p>' +
            '<pre style="margin:0 0 12px;font-size:11px;background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto"></pre>' +
            '<button onclick="location.reload()" style="padding:8px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:12px">Muat Ulang</button>' +
            '</div></div>';
          root.querySelector('pre').textContent = msg;
        }
        window.addEventListener('error', function (e) {
          show((e && e.message ? e.message : 'Error tidak diketahui') + (e && e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          show('Promise ditolak: ' + (r && r.message ? r.message : String(r)));
        });
        // Kalau setelah 10 detik root masih kosong, anggap gagal start.
        setTimeout(function () {
          show('Tidak ada tampilan setelah 10 detik. Kemungkinan file aplikasi gagal diunduh, atau browser HP terlalu lama untuk menjalankannya.');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
